<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Usuário</title>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-container">
        <div class="content-wrapper">

            <div id="conteudo-app" class="app-content">


                <div class="layout-grid">

                    <div class="sidebar-col">
                        <div class="form-card">
                            <div class="form-header">
                                <h2 id="form-titulo" class="form-title">Nova Sugestão</h2>
                                <button id="btn-cancelar" class="btn-cancel hidden">Cancelar Edição</button>
                            </div>

                            <form id="form-usuario" class="form-body">
                                <input type="hidden" id="user-id" value="">

                                <div class="form-group">
                                    <label class="form-label" for="user-nome">
                                        Seu Nome <span class="required">*</span>
                                    </label>
                                    <input type="text" id="user-nome" class="form-control" placeholder="Ex: Maria Silva"
                                        required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="user-mensagem">
                                        Mensagem <span class="required">*</span>
                                    </label>
                                    <textarea id="user-mensagem" class="form-control"
                                        placeholder="Descreva sua sugestão..." required></textarea>
                                </div>
                                    
                                <div class="form-group">
                                    <label class="form-label" for="user-area">Área</label>
                                    <select id="user-area" class="form-control">
                                        <option value="RH">RH</option>
                                        <option value="Atendimento">Atendimento</option>
                                        <option value="TI">TI</option>
                                        <option value="Infraestrutura">Infraestrutura</option>
                                        <option value="Comunicacao">Comunicação</option>
                                        <option value="Outros">Outros</option>
                                    </select>
                                </div>

                                <button type="submit" id="btn-salvar" class="btn-submit">
                                    <span id="btn-salvar-text">💡 Enviar Sugestão</span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="main-col">
                        <div class="table-card">
                            <div class="form-header">
                                <h2 class="form-title">Sugestões Enviadas</h2>
                                <button onclick="criarTabelaUsuarios()" class="btn-refresh">
                                    <i class="fas fa-sync-alt"></i> Atualizar
                                </button>
                            </div>

                            <div class="table-responsive">
                                <table class="data-table">
                                    <thead>
                                        <tr class="table-head-row">
                                            <th>ID</th>
                                            <th>Autor / Mensagem</th>
                                            <th>Data</th>
                                            <th>Área</th>
                                            <th class="text-center">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabela-corpo">
                                        <tr>
                                            <td colspan="4" class="empty-state">
                                                <i class="fas fa-spinner fa-spin"></i><br>
                                                Carregando dados...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script type="module" src="./script.js"></script>

</body>

</html>
